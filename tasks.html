<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Tasks | TaskNest</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="dashboard.html">✦ TaskNest</a><nav><a href="dashboard.html">Dashboard</a><a class="active" href="tasks.html">My Tasks</a><a href="about.html">About</a><button class="btn small" id="logoutBtn">Logout ↗</button></nav></header><main class="dash"><div class="welcome"><div><span class="eyebrow">STAY ON TRACK</span><h1>My tasks</h1><p class="muted">Add your work, set priorities and mark tasks complete.</p></div></div><section class="panel task-form-panel"><h2 id="formTitle">Add a new task</h2><form id="taskForm" class="task-form"><input id="taskTitle" placeholder="Task name (e.g. Complete Java assignment)" required><input id="taskSubject" placeholder="Subject / category"><input id="taskDate" type="date"><select id="taskPriority"><option>Medium</option><option>High</option><option>Low</option></select><button class="btn primary" type="submit" id="saveTask">Add task +</button><button class="btn light hidden" type="button" id="cancelEdit">Cancel</button></form></section><div class="filter-row"><input id="searchTask" placeholder="⌕ Search tasks..."><select id="filterStatus"><option value="all">All tasks</option><option value="pending">Pending</option><option value="completed">Completed</option></select><select id="filterPriority"><option value="all">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select></div><section class="panel"><div class="panel-head"><h2>Your task list</h2><span class="muted" id="taskCountLabel">0 tasks</span></div><div id="allTasks" class="task-list"></div></section></main><footer>© 2026 TaskNest · Designed & developed by <b>Ritu Khuman</b></footer><script src="app.js"></script></body></html>
